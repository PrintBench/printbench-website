name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `npm run build` is `astro check && astro build`, so this one step is both the
  # type/content-collection check and proof that the static site still builds.
  # Job names are what branch protection matches on: keep them stable.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major as the Dockerfile's build stage, so CI fails on what production would.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check and build
        run: npm run build

  # Production ships as this container, so prove the image builds and nginx serves it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: printbench-website-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container serves the site
        run: |
          trap 'docker logs printbench-website-ci || true; docker rm -f printbench-website-ci' EXIT
          docker run -d --name printbench-website-ci -p 8080:80 printbench-website-ci:latest

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/health -o /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ -o /dev/null
          trap - EXIT
          docker rm -f printbench-website-ci
